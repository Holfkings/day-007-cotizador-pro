name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Suite de pruebas
        run: python -m pytest -v

      - name: Byte-compilacion de todos los modulos
        run: python -m compileall -q cotizador tools

  paridad-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintaxis JavaScript de la demo
        run: |
          node --check docs/motor.js
          node --check docs/demo.js

      - name: Paridad entre el motor Python y el de la demo
        run: python tools/check_demo_contract.py

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke test del motor en Node
        run: |
          cat > smoke.mjs <<'EOF'
          global.window = globalThis;
          await import('./docs/motor.js');
          const m = globalThis.CotizadorPro;
          const c = m.calcularCotizacion({
            clienteNit: '901444777-2',
            items: [{ sku: 'SW-LIC-PRO', cantidad: 15, descuentoPct: 8, bonificacion: false,
                      tipoDescuento: 'porcentaje', valorDescuento: 0 }],
            descuentoAdicional: 0, tipoDescuentoAdicional: 'porcentaje',
          });
          const esperado = '$22.021.902,00';
          if (m.formatear(c.total) !== esperado) {
            throw new Error('total inesperado: ' + m.formatear(c.total) + ' != ' + esperado);
          }
          console.log('total verificado: ' + m.formatear(c.total));
          EOF
          node smoke.mjs
          rm smoke.mjs

      - name: La demo referencia los archivos que existen
        run: |
          grep -q 'src="motor.js"' docs/index.html
          grep -q 'src="demo.js"' docs/index.html
          grep -q 'href="styles.css"' docs/index.html